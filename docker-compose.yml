services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorybox}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      # Host port defaults to 5433, not 5432: many dev machines already run a local
      # PostgreSQL install on 5432, and binding the same host port would silently
      # route connections to that instance instead of this container. Override with
      # POSTGRES_PORT if 5433 is also taken.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - memory-box-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memorybox} -d ${POSTGRES_DB:-memorybox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-memorybox}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-false}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      METADATA_FETCH_ENABLED: ${METADATA_FETCH_ENABLED:-true}
      PROCESSING_WORKER_ENABLED: ${PROCESSING_WORKER_ENABLED:-true}

volumes:
  memory-box-db-data:
