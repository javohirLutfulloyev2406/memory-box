spring.application.name=memory-box

# --- Database ---
# Defaults match docker-compose.yml so `./mvnw spring-boot:run` works out of the box
# against `docker compose up -d db`. Override via environment variables in real
# deployments; never commit real credentials.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/memorybox}
spring.datasource.username=${DATABASE_USERNAME:memorybox}
spring.datasource.password=${DATABASE_PASSWORD:change-me}

# Flyway owns the schema. Hibernate only validates that entity mappings match what
# Flyway created; it must never auto-generate or alter DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.show_sql=false

spring.flyway.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- Security ---
# Development-only authentication bypass (see common.security.DevAuthenticationFilter).
# MUST stay false unless explicitly enabled for local development; there is no
# production-safe way to turn this on, so it is never flipped on by a profile that
# could plausibly run in production.
app.security.dev-auth.enabled=${DEV_AUTH_ENABLED:false}
app.security.dev-auth.display-name=Dev User

# --- Telegram bot integration ---
# Disabled unless a token is explicitly configured. See README for webhook setup.
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
telegram.bot.api-base-url=${TELEGRAM_API_BASE_URL:https://api.telegram.org}

# --- Metadata fetching (SSRF-safe title/description extraction) ---
app.metadata-fetch.enabled=${METADATA_FETCH_ENABLED:true}
app.metadata-fetch.connect-timeout-ms=3000
app.metadata-fetch.read-timeout-ms=5000
app.metadata-fetch.max-response-bytes=2097152

# --- Background processing worker (Postgres-backed job queue) ---
app.processing.worker.enabled=${PROCESSING_WORKER_ENABLED:true}
app.processing.worker.poll-interval-ms=10000
app.processing.worker.batch-size=5
app.processing.worker.max-attempts=5
app.processing.worker.retry-backoff-seconds=30

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
