# Convenience profile for local development: run with `--spring.profiles.active=local`
# (or SPRING_PROFILES_ACTIVE=local). Enables the fixed-test-user dev authentication
# bypass so the API is usable without building a real login flow yet.
app.security.dev-auth.enabled=true

spring.jpa.properties.hibernate.show_sql=true
logging.level.memory.box.memorybox=DEBUG